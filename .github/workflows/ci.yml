name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Run pre-commit gates
        run: scripts/run-project-tool pre-commit run --all-files
      - name: Run tests with coverage gate
        run: scripts/run-project-tool pytest -q -p no:cacheprovider --cov-fail-under=90
