measurement:
  device: auto
  local_files_only: false
  torch_dtype: float32
  deterministic_algorithms: true
  deterministic_warn_only: true
  seed: 20261014
  train_items_per_family: 8
  validation_items_per_family: 1
  test_items_per_family: 1
  max_generation_attempts: 100
  max_new_tokens: 48
  probe_steps: 8
  probe_batch_size: 1
  probe_learning_rate: 0.0005
  probe_weight_decay: 0.0
  generation_benchmark_prompts: 2
  generation_benchmark_new_tokens: 32
  generation_benchmark_warmup_runs: 1
  generation_benchmark_repetitions: 3
  scoring_stride_tokens: 256
  load_retries: 4
  load_retry_backoff_seconds: 2.0
  memory_sample_interval_seconds: 0.02
  candidate_timeout_seconds: 1800.0
  utf8_roundtrip_samples:
    - " leading and trailing whitespace "
    - "multiple   spaces\tand\nlines"
    - "nul:\u0000:end"
    - "e\u0301 and é"
    - "日本語と漢字"
    - "مرحبا بالعالم"
    - "emoji: 🧠🚀🌍"
  heldout_text_path: ../aptivra/eval/model_card_heldout_text_v1.txt
  heldout_prompts_path: ../aptivra/eval/model_card_heldout_v1.json

decision:
  permissive_licenses:
    - apache-2.0
    - mit
  target_memory_bytes: 38654705664
  minimum_memory_headroom_fraction: 0.25
  minimum_mean_learned_accuracy: 0.0
  minimum_mean_accuracy_gain: 0.0

execution:
  output_dir: ../experiments/base_model_candidates
  resume: true
