[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aptivra"
version = "0.1.0"
description = "Aptivra: Continual Learning with Tiered Memory, Growable Expert Modules, and Verifiable Consolidation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.40.0",
]
mlx = [
    "mlx>=0.18.0",
]
chat = [
    "gradio>=4.44.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-pyyaml>=6.0.0",
    "transformers>=4.40.0",
]

[project.urls]
Homepage = "https://github.com/chavaraghunath/Aptivra"
Repository = "https://github.com/chavaraghunath/Aptivra"
"Model checkpoint" = "https://huggingface.co/raghunath1/aptivra-200m-tiered-memory"

[tool.setuptools.packages.find]
where = ["."]
include = ["aptivra", "aptivra.*"]
namespaces = false

[tool.setuptools.package-data]
"aptivra.eval" = ["*.json", "*.txt"]
"aptivra.resources" = ["configs/*.yaml", "huggingface_hub/*.py.template"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.py.template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["N812"]


[tool.mypy]
python_version = "3.12"

strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "transformers.*", "mlx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aptivra.huggingface.*"]
disable_error_code = ["no-untyped-call"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=aptivra --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
