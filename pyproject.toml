[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aptivra"
version = "0.1.0"
description = "Aptivra: Continual Learning with Tiered Memory, Growable Expert Modules, and Verifiable Consolidation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "gguf>=0.19.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23.0",
    "safetensors>=0.4.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
hf = [
]
mlx = [
    "mlx>=0.18.0",
]
chat = [
    "gradio>=4.44.0",
    "transformers>=4.40.0",
]
dev = [
    "cosmic-ray>=8.4.3",
    "mutmut>=3.8.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-pyyaml>=6.0.0",
    "transformers>=4.40.0",
]

[project.urls]
Homepage = "https://github.com/chavaraghunath/Aptivra"
Repository = "https://github.com/chavaraghunath/Aptivra"
"Model checkpoint" = "https://huggingface.co/raghunath1/aptivra-200m-tiered-memory"

[tool.setuptools.packages.find]
where = ["."]
include = ["aptivra", "aptivra.*"]
namespaces = false

[tool.setuptools.package-data]
"aptivra.eval" = ["*.json", "*.txt"]
"aptivra.resources" = ["configs/*.yaml", "huggingface_hub/*.py.template"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.py.template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["N812"]


[tool.mypy]
python_version = "3.12"

strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "transformers.*", "mlx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aptivra.huggingface.*"]
disable_error_code = ["no-untyped-call"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=aptivra --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mutmut]
# Mutate the complete Python package. There are intentionally no source or operator exclusions.
source_paths = ["aptivra"]
also_copy = ["configs", "deploy", "experiments", "scripts", "README.md", "LICENSE"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "--no-cov"]
pytest_add_cli_args_test_selection = ["tests"]
mutate_only_covered_lines = false
timeout_multiplier = 3.0
timeout_constant = 10.0
# Mutation pytest disables accelerator discovery before torch can initialize MPS.
# Direct fork mode keeps statistics in the original process; forkserver would first
# fork the statistics process, which is itself unsafe for macOS torch autograd.
process_isolation = "fork"
on_dependency_change = "rerun"
# Content hashes make interrupted runs resumable even in an intentionally dirty
# worktree; comparing only with HEAD would rediscover the same local edits forever.
use_git_change_detection = false
cache_invalidation_files = [
    "tests/**/*.py",
    "tests/**/*.json",
    "tests/**/*.yaml",
    "tests/**/*.yml",
    "tests/**/*.txt",
    "configs/**/*",
    "deploy/**/*",
    "experiments/**/*",
    "scripts/**/*",
    "aptivra/**/*.json",
    "aptivra/**/*.txt",
    "aptivra/**/*.template",
    "README.md",
    "LICENSE",
]
