task_stream_audit:
  baseline_sample_size: 25
  streams:
    - stream_config: configs/task_stream.yaml
      output: experiments/task_stream_v1_audit.json
      policy:
        max_target_overlap_count: 107
        max_structural_overlap_count: 14
        max_identity_chat_contamination_count: 0
        max_uniform_chance: 0.5
        max_trivial_baseline_accuracy: 0.64
        max_ambiguous_item_count: 900
    - stream_config: configs/task_stream_v2.yaml
      output: experiments/task_stream_v2_audit.json
      policy:
        max_target_overlap_count: 0
        max_structural_overlap_count: 0
        max_identity_chat_contamination_count: 0
        max_uniform_chance: 0.05
        max_trivial_baseline_accuracy: 0.1
        max_ambiguous_item_count: 0
