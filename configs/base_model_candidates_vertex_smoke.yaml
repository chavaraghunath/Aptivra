# Minimal CUDA account/code-path smoke test. This record never enters Amendment 4d ranking.
equivalence_gate:
  owner_override:
    by: raghunath
    date: "2026-10-14"
    adr_section: Owner override of Amendment 4b (2026-10-14)

candidates:
  - id: gpt2
    source: openai-community/gpt2
    revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
    license: mit
    architecture: gpt2
    loader: transformers
    reference_only: false

measurement:
  device: cuda
  pristine_model_device: host
  local_files_only: false
  torch_dtype: float32
  deterministic_algorithms: true
  deterministic_warn_only: true
  seed: 20261014
  variance_seeds: [20261014, 20261015, 20261016]
  variance_top_candidates: 1
  train_items_per_family: 8
  validation_items_per_family: 1
  test_items_per_family: 1
  max_generation_attempts: 1000
  max_new_tokens: 4
  probe_steps: 2
  probe_batch_size: 1
  probe_micro_batch_sizes: [1]
  target_only_training_loss: true
  gradient_checkpointing_fallback: true
  equivalence_candidate_ids: [gpt2]
  equivalence_steps: 1
  equivalence_loss_absolute_tolerance: 0.00005
  equivalence_update_max_absolute_tolerance: 0.000001
  equivalence_update_relative_l2_tolerance: 0.0001
  equivalence_exact_loss_absolute_tolerance: 0.000000000001
  equivalence_exact_gradient_relative_l2_tolerance: 0.0000000001
  equivalence_noise_floor_batches: 3
  equivalence_noise_floor_multiplier: 2.0
  equivalence_trajectory_steps: 1
  equivalence_protocol: amendment_4b
  equivalence_shape_control_chunk_size: 1
  equivalence_outcome_seeds: [0, 1]
  probe_learning_rates: [0.00001]
  probe_warmup_steps: 0
  probe_weight_decay: 0.0
  evaluation_batch_size: 1
  confidence_level: 0.95
  generation_benchmark_prompts: 1
  generation_benchmark_new_tokens: 2
  generation_benchmark_warmup_runs: 0
  generation_benchmark_repetitions: 1
  scoring_stride_tokens: 32
  load_retries: 4
  load_retry_backoff_seconds: 2.0
  memory_sample_interval_seconds: 0.02
  swap_sample_interval_seconds: 0.5
  environment_minimum_free_memory_percent: 10.0
  environment_recovery_timeout_seconds: 60.0
  environment_max_attempts: 1
  candidate_timeout_seconds: 900.0
  expected_wall_time_seconds: 900.0
  utf8_roundtrip_samples:
    - " leading and trailing whitespace "
    - "e\u0301 and é"
    - "日本語"
  heldout_text_path: ../aptivra/eval/model_card_heldout_text_v1.txt
  heldout_prompts_path: ../aptivra/eval/model_card_heldout_v1.json

decision:
  permissive_licenses: [apache-2.0, mit]
  target_memory_bytes: 17179869184
  minimum_memory_headroom_fraction: 0.25
  minimum_mean_learned_accuracy: 0.0
  minimum_mean_accuracy_gain: 0.0
  learnability_tie_margin: 0.02
  clustered_confidence_interval_intersects_tie_region: true
  maximum_swap_growth_bytes: 1073741824
  require_complete_candidate_measurements: true

execution:
  output_dir: ../experiments/base_model_candidates/vertex-smoke
  resume: true
  allow_host_restart: true
