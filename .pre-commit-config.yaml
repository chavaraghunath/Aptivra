repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(experiments/|.*\.(?:pt|gguf|safetensors)$)
      - id: end-of-file-fixer
        exclude: ^(experiments/|.*\.(?:pt|gguf|safetensors)$)
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: scripts/run-project-tool ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict (aptivra)
        entry: scripts/run-project-tool mypy --strict aptivra
        language: system
        pass_filenames: false
        always_run: true
      - id: reject-model-artifacts
        name: reject committed model artifacts
        entry: Model artifacts (*.pt, *.gguf, *.safetensors) must not be committed
        language: fail
        files: (?i)\.(?:pt|gguf|safetensors)$
